services:
  postgres:
    image: postgres:17
    container_name: logisense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: logisense
      POSTGRES_USER: logisense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - logisense-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logisense -d logisense"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  logisense-pgdata:
